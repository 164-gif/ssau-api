openapi: 3.1.0
info:
  title: Samara University public news API
  version: "1.0.0"
  description: >-
    OpenAPI description of currently verified public read-only data interfaces
    on the Samara University website. The public news endpoint is documented at
    https://ssau.ru/api_docs. The protected timetable proxy is listed separately
    in the inventory because it was observed in a client but not live-verified.
    Only a subset of parameter combinations has been verified independently.
servers:
  - url: https://ssau.ru
paths:
  /get_program/{id}:
    get:
      servers:
        - url: https://priemsamara.ru
      operationId: getAdmissionProgramFragment
      summary: Get an admission program HTML fragment
      description: >-
        Public AJAX fragment loaded by the admissions site when a program is
        selected. The fragment can contain contact details; raw examples are
        not included in this repository.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: HTML fragment for a program card.
          content:
            text/html:
              schema:
                type: string
  /get_fac/{facultyId}/bac:
    get:
      servers:
        - url: https://priemsamara.ru
      operationId: getFacultyBachelorProgramsFragment
      summary: Get an admissions faculty bachelor programs fragment
      parameters:
        - name: facultyId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: HTML fragment with faculty bachelor programs.
          content:
            text/html:
              schema:
                type: string
  /rasp/search:
    post:
      operationId: searchScheduleGroups
      summary: Search public schedule groups
      description: >-
        Read-only search implemented as POST. First load /rasp, retain its
        session cookie, and send its csrf-token meta value in X-CSRF-TOKEN.
      parameters:
        - name: X-CSRF-TOKEN
          in: header
          required: true
          description: Token copied from the public /rasp page.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  description: Group name or other text to search.
      responses:
        "200":
          description: Matching schedule groups.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    url:
                      type: string
                    text:
                      type: string
        default:
          description: Error response; exact error schema is not documented.
  /rss/:
    get:
      operationId: getNewsRssFeed
      summary: Get the public news RSS feed
      description: >-
        This is an RSS 2.0 feed linked from the portal footer. It is a feed
        interface, not a documented REST operation; no query parameters are
        documented.
      responses:
        "200":
          description: RSS 2.0 document.
          content:
            text/xml:
              schema:
                type: string
  /api/news/:
    get:
      operationId: listNews
      summary: List or filter public university news
      description: >-
        The same endpoint supports listing, title search, lookup by ID, date and
        type filters, tags, language, slideshow filtering, and XML output.
      parameters:
        - name: id
          in: query
          required: false
          description: Return the news item with this identifier.
          schema:
            type: integer
        - name: q
          in: query
          required: false
          description: Case-insensitive substring search in the title.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of returned items; documented maximum is 50.
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 50
        - name: index
          in: query
          required: false
          description: Starting result index. Pagination boundary semantics need more verification.
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: date-start
          in: query
          required: false
          description: Earliest publication date, inclusive according to the documentation.
          schema:
            type: string
            format: date
        - name: date-end
          in: query
          required: false
          description: Latest publication date, inclusive according to the documentation.
          schema:
            type: string
            format: date
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [all, news, announcements, sitenews]
            default: all
        - name: tags
          in: query
          required: false
          description: Comma-separated tags; spaces in tag names should be replaced with underscores.
          schema:
            type: string
        - name: lang
          in: query
          required: false
          schema:
            type: string
            enum: [ru, en]
            default: ru
        - name: slideshow
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: xml
          in: query
          required: false
          description: Set true to request XML rather than JSON.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: News results in JSON by default, or XML when xml=true.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NewsItem"
            text/xml:
              schema:
                type: string
        default:
          description: Error response; exact error schema is not documented.
components:
  schemas:
    NewsItem:
      type: object
      description: Fields listed in official documentation; live field names can differ.
      properties:
        id:
          type: integer
        title:
          type: string
        descr:
          type: string
        pubText:
          type: string
          description: Publication body, commonly HTML.
        pubDate:
          type: string
          description: Publication date and time in YYYY-MM-DD hh:mm:ss format.
        pic:
          type: string
          format: uri
        type:
          type: string
        slideshow:
          type: [integer, string]
        slidewhow:
          type: [integer, string]
          description: Observed live spelling; official docs use slideshow.
        slide:
          type: string
        tags:
          type: string
        url:
          type: string
          format: uri
