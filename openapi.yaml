openapi: 3.1.0
info:
  title: Selected Samara University public APIs
  version: "1.0.0"
  description: >-
    OpenAPI description of selected verified public read-only interfaces across
    Samara University sites. It is not the complete inventory; see
    data/api-inventory.json and docs/coverage.md for coverage and unverified
    candidates. The protected timetable and cabinet APIs are not callable here.
servers:
  - url: https://ssau.ru
paths:
  /oai/request:
    get:
      servers:
        - url: https://repo.ssau.ru
      operationId: getRepositoryOaiPmhResponse
      summary: Request a read-only repository OAI-PMH operation
      description: >-
        Identify, ListMetadataFormats and ListSets were verified. The OAI
        ListIdentifiers, GetRecord and ListRecords operations are not yet tested.
      parameters:
        - name: verb
          in: query
          required: true
          schema:
            type: string
            enum: [Identify, ListMetadataFormats, ListSets]
      responses:
        "200":
          description: OAI-PMH XML response.
          content:
            application/xml:
              schema:
                type: string
  /wp-json/:
    get:
      servers:
        - url: https://alumni.ssau.ru
      operationId: getAlumniWordPressRouteIndex
      summary: Get the public WordPress REST route index
      description: >-
        Returns registered route templates. The index does not imply that every
        listed operation is anonymously accessible. A sanitized route list is
        stored in data/alumni-wp-rest-routes.json.
      responses:
        "200":
          description: WordPress REST API route index.
          content:
            application/json:
              schema:
                type: object
  /wp-json/wp/v2/posts:
    get:
      servers:
        - url: https://alumni.ssau.ru
      operationId: listAlumniPublicPosts
      summary: List public alumni site posts
      description: >-
        Public GET verified with per_page=1 and an _fields allowlist. Write
        methods advertised by WordPress were not invoked.
      parameters:
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: _fields
          in: query
          required: false
          description: Comma-separated response field allowlist.
          schema:
            type: string
      responses:
        "200":
          description: Public posts.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
  /wp-json/wp/v2/pages:
    get:
      servers:
        - url: https://alumni.ssau.ru
      operationId: listAlumniPublicPages
      summary: List public alumni site pages
      parameters:
        - $ref: "#/components/parameters/WpPerPage"
        - $ref: "#/components/parameters/WpFields"
      responses:
        "200":
          description: Public pages.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WordPressCollection"
  /wp-json/wp/v2/mec-events:
    get:
      servers:
        - url: https://alumni.ssau.ru
      operationId: listAlumniPublicEventPosts
      summary: List public event posts
      parameters:
        - $ref: "#/components/parameters/WpPerPage"
        - $ref: "#/components/parameters/WpFields"
      responses:
        "200":
          description: Public event posts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WordPressCollection"
  /wp-json/wp/v2/categories:
    get:
      servers:
        - url: https://alumni.ssau.ru
      operationId: listAlumniCategories
      summary: List public categories
      parameters:
        - $ref: "#/components/parameters/WpPerPage"
        - $ref: "#/components/parameters/WpFields"
      responses:
        "200":
          description: Public categories.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WordPressCollection"
  /wp-json/wp/v2/media:
    get:
      servers:
        - url: https://alumni.ssau.ru
      operationId: listAlumniMediaMetadata
      summary: List public media metadata
      description: Only limited metadata fields were requested during verification.
      parameters:
        - $ref: "#/components/parameters/WpPerPage"
        - $ref: "#/components/parameters/WpFields"
      responses:
        "200":
          description: Public media metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WordPressCollection"
  /wp-json/wp/v2/types:
    get:
      servers:
        - url: https://alumni.ssau.ru
      operationId: listAlumniPostTypes
      summary: List registered post types
      responses:
        "200":
          description: Object mapping post type slugs to public metadata.
          content:
            application/json:
              schema:
                type: object
  /wp-json/wp/v2/taxonomies:
    get:
      servers:
        - url: https://alumni.ssau.ru
      operationId: listAlumniTaxonomies
      summary: List registered taxonomies
      responses:
        "200":
          description: Object mapping taxonomy slugs to metadata.
          content:
            application/json:
              schema:
                type: object
  /index/ru/oai:
    get:
      servers:
        - url: https://journals.ssau.ru
      operationId: getJournalOaiPmhResponse
      summary: Request a read-only OAI-PMH operation
      description: >-
        Identify, ListMetadataFormats, ListSets, ListIdentifiers and GetRecord
        were verified. GetRecord works on the computeroptics journal endpoint;
        the root endpoint returns badArgument for an identifier it emitted.
      parameters:
        - name: verb
          in: query
          required: true
          schema:
            type: string
            enum: [Identify, ListMetadataFormats, ListSets, ListIdentifiers, GetRecord]
        - name: metadataPrefix
          in: query
          required: false
          description: Required by ListIdentifiers and GetRecord.
          schema:
            type: string
            example: oai_dc
        - name: identifier
          in: query
          required: false
          description: Required by GetRecord; use an identifier from the same journal base URL.
          schema:
            type: string
      responses:
        "200":
          description: OAI-PMH XML response.
          content:
            text/xml:
              schema:
                type: string
  /computeroptics/ru/oai:
    get:
      servers:
        - url: https://journals.ssau.ru
      operationId: getComputerOpticsOaiPmhResponse
      summary: Read OAI-PMH metadata for Computer Optics
      description: >-
        The five documented read-only verbs were checked for this journal.
        GetRecord succeeds when identifier is copied from this endpoint's
        ListIdentifiers response.
      parameters:
        - name: verb
          in: query
          required: true
          schema:
            type: string
            enum: [Identify, ListMetadataFormats, ListSets, ListIdentifiers, GetRecord]
        - name: metadataPrefix
          in: query
          required: false
          schema:
            type: string
            example: oai_dc
        - name: identifier
          in: query
          required: false
          description: Identifier returned by this journal endpoint; required for GetRecord.
          schema:
            type: string
        - name: resumptionToken
          in: query
          required: false
          description: OAI-PMH continuation token; pagination has not been followed.
          schema:
            type: string
      responses:
        "200":
          description: OAI-PMH XML response, possibly containing a protocol error element.
          content:
            text/xml:
              schema:
                type: string
  /get_program/{id}:
    get:
      servers:
        - url: https://priemsamara.ru
      operationId: getAdmissionProgramFragment
      summary: Get an admission program HTML fragment
      description: >-
        Public AJAX fragment loaded by the admissions site when a program is
        selected. The fragment can contain contact details; raw examples are
        not included in this repository.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: HTML fragment for a program card.
          content:
            text/html:
              schema:
                type: string
  /get_fac/{facultyId}/bac:
    get:
      servers:
        - url: https://priemsamara.ru
      operationId: getFacultyBachelorProgramsFragment
      summary: Get an admissions faculty bachelor programs fragment
      parameters:
        - name: facultyId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: HTML fragment with faculty bachelor programs.
          content:
            text/html:
              schema:
                type: string
  /get_fac/{facultyId}/mag:
    get:
      servers:
        - url: https://priemsamara.ru
      operationId: getFacultyMasterProgramsFragment
      summary: Get an admissions faculty master's programs fragment
      parameters:
        - name: facultyId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: HTML fragment with faculty master's programs.
          content:
            text/html:
              schema:
                type: string
  /get_asp_fac/{facultyId}:
    get:
      servers:
        - url: https://priemsamara.ru
      operationId: getFacultyPostgraduateProgramsFragment
      summary: Get an admissions faculty postgraduate programs fragment
      parameters:
        - name: facultyId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: HTML fragment with postgraduate programs.
          content:
            text/html:
              schema:
                type: string
  /ratings/:
    get:
      servers:
        - url: https://priemsamara.ru
      operationId: getAdmissionRatingTable
      summary: Get an admission rating table
      description: >-
        Public HTML table linked from the programs page. The response contains
        applicant data; this catalog records the route and parameters only and
        does not store response rows.
      parameters:
        - name: pk
          in: query
          required: true
          description: Program identifier.
          schema:
            type: integer
        - name: filter
          in: query
          required: true
          schema:
            type: string
            example: enrolled
        - name: pay
          in: query
          required: false
          schema:
            type: string
            example: budget
      responses:
        "200":
          description: HTML rating table.
          content:
            text/html:
              schema:
                type: string
  /ratings_spo/:
    get:
      servers:
        - url: https://priemsamara.ru
      operationId: getSpoAdmissionRatingTable
      summary: Get a vocational education admission rating table
      description: >-
        Public HTML table; verified headers include a SNILS column. Applicant
        rows are intentionally not included in this specification.
      parameters:
        - name: pk
          in: query
          required: true
          description: Program identifier.
          schema:
            type: integer
        - name: filter
          in: query
          required: true
          schema:
            type: string
            example: all
        - name: pay
          in: query
          required: false
          schema:
            type: string
            example: budget
      responses:
        "200":
          description: HTML rating table.
          content:
            text/html:
              schema:
                type: string
  /rasp/search:
    post:
      operationId: searchScheduleGroups
      summary: Search public schedule groups
      description: >-
        Read-only search implemented as POST. First load /rasp, retain its
        session cookie, and send its csrf-token meta value in X-CSRF-TOKEN.
      parameters:
        - name: X-CSRF-TOKEN
          in: header
          required: true
          description: Token copied from the public /rasp page.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  description: Group name or other text to search.
      responses:
        "200":
          description: Matching schedule groups.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    url:
                      type: string
                    text:
                      type: string
        default:
          description: Error response; exact error schema is not documented.
  /rss/:
    get:
      operationId: getNewsRssFeed
      summary: Get the public news RSS feed
      description: >-
        This is an RSS 2.0 feed linked from the portal footer. It is a feed
        interface, not a documented REST operation; no query parameters are
        documented.
      responses:
        "200":
          description: RSS 2.0 document.
          content:
            text/xml:
              schema:
                type: string
  /api/news/:
    get:
      operationId: listNews
      summary: List or filter public university news
      description: >-
        The same endpoint supports listing, title search, lookup by ID, date and
        type filters, tags, language, slideshow filtering, and XML output.
      parameters:
        - name: id
          in: query
          required: false
          description: Return the news item with this identifier.
          schema:
            type: integer
        - name: q
          in: query
          required: false
          description: Case-insensitive substring search in the title.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of returned items; documented maximum is 50.
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 50
        - name: index
          in: query
          required: false
          description: Starting result index. Pagination boundary semantics need more verification.
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: date-start
          in: query
          required: false
          description: Earliest publication date, inclusive according to the documentation.
          schema:
            type: string
            format: date
        - name: date-end
          in: query
          required: false
          description: Latest publication date, inclusive according to the documentation.
          schema:
            type: string
            format: date
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [all, news, announcements, sitenews]
            default: all
        - name: tags
          in: query
          required: false
          description: Comma-separated tags; spaces in tag names should be replaced with underscores.
          schema:
            type: string
        - name: lang
          in: query
          required: false
          schema:
            type: string
            enum: [ru, en]
            default: ru
        - name: slideshow
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: xml
          in: query
          required: false
          description: Set true to request XML rather than JSON.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: News results in JSON by default, or XML when xml=true.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NewsItem"
            text/xml:
              schema:
                type: string
        default:
          description: Error response; exact error schema is not documented.
components:
  parameters:
    WpPerPage:
      name: per_page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
    WpFields:
      name: _fields
      in: query
      required: false
      description: Comma-separated field allowlist.
      schema:
        type: string
  schemas:
    WordPressCollection:
      type: array
      items:
        type: object
    NewsItem:
      type: object
      description: Fields listed in official documentation; live field names can differ.
      properties:
        id:
          type: integer
        title:
          type: string
        descr:
          type: string
        pubText:
          type: string
          description: Publication body, commonly HTML.
        pubDate:
          type: string
          description: Publication date and time in YYYY-MM-DD hh:mm:ss format.
        pic:
          type: string
          format: uri
        type:
          type: string
        slideshow:
          type: [integer, string]
        slidewhow:
          type: [integer, string]
          description: Observed live spelling; official docs use slideshow.
        slide:
          type: string
        tags:
          type: string
        url:
          type: string
          format: uri
